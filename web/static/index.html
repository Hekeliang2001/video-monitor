<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>视频控制台</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>视频控制台</h1>
        <p id="commandPreview" class="command-preview">等待配置</p>
      </div>
      <div id="statusPill" class="status-pill status-idle">未运行</div>
    </header>

    <main class="workspace">
      <section class="tool-panel config-panel" aria-labelledby="configTitle">
        <div class="panel-header">
          <h2 id="configTitle">配置</h2>
        </div>

        <form id="controlForm" class="control-form">
          <label class="field field-wide">
            <span>课程 URL</span>
            <textarea id="url" name="url" rows="4" required spellcheck="false"></textarea>
          </label>

          <div class="field-grid">
            <label class="field">
              <span>手机号</span>
              <input id="loginPhone" name="loginPhone" type="text" autocomplete="username" spellcheck="false" />
            </label>

            <label class="field">
              <span>密码</span>
              <input id="loginPassword" name="loginPassword" type="password" autocomplete="current-password" />
            </label>
          </div>

          <div class="field-grid">
            <label class="field">
              <span>浏览器</span>
              <select id="browserChannel" name="browserChannel">
                <option value="msedge">Edge</option>
                <option value="chrome">Chrome</option>
              </select>
            </label>

            <label class="field">
              <span>检测间隔</span>
              <input id="monitorInterval" name="monitorInterval" type="number" min="0.1" step="0.1" value="2" />
            </label>

            <label class="field">
              <span>播放倍速</span>
              <input id="playbackRate" name="playbackRate" type="number" min="0.1" step="0.1" value="2" />
            </label>

            <label class="field">
              <span>无视频等待</span>
              <input id="noVideoNextDelay" name="noVideoNextDelay" type="number" min="0" step="0.5" value="3" />
            </label>
          </div>

          <label class="field field-wide">
            <span>下一节选择器</span>
            <input id="nextSelector" name="nextSelector" type="text" value="#prevNextFocusNext" spellcheck="false" />
          </label>

          <label class="field field-wide">
            <span>Bark Key 或 URL</span>
            <input id="barkUrl" name="barkUrl" type="text" autocomplete="off" spellcheck="false" />
          </label>

          <div class="bark-action-row">
            <button id="testBarkButton" class="test-button" type="button">测试推送</button>
          </div>

          <div class="toggle-grid" aria-label="播放设置">
            <label class="toggle-row">
              <input id="autoLogin" name="autoLogin" type="checkbox" checked />
              <span>自动登录</span>
            </label>
            <label class="toggle-row">
              <input id="rememberPassword" name="rememberPassword" type="checkbox" />
              <span>记住密码</span>
            </label>
            <label class="toggle-row">
              <input id="autoPlay" name="autoPlay" type="checkbox" checked />
              <span>自动播放</span>
            </label>
            <label class="toggle-row">
              <input id="playSequential" name="playSequential" type="checkbox" checked />
              <span>顺序播放</span>
            </label>
            <label class="toggle-row">
              <input id="muteBeforeAutoPlay" name="muteBeforeAutoPlay" type="checkbox" checked />
              <span>静音播放</span>
            </label>
            <label class="toggle-row">
              <input id="notifySectionComplete" name="notifySectionComplete" type="checkbox" />
              <span>每节完成提醒</span>
            </label>
            <label class="toggle-row">
              <input id="notifyAllComplete" name="notifyAllComplete" type="checkbox" />
              <span>全部完成提醒</span>
            </label>
          </div>

          <div class="config-action-row">
            <button id="saveConfigButton" class="save-button" type="button">保存配置</button>
            <button id="clearConfigButton" class="ghost-button" type="button">清除保存</button>
          </div>

          <div class="action-row">
            <button id="startButton" class="primary-button" type="submit">开始</button>
            <button id="pauseButton" class="pause-button" type="button" disabled>暂停</button>
            <button id="stopButton" class="secondary-button" type="button" disabled>停止</button>
          </div>
        </form>
      </section>

      <section class="tool-panel log-panel" aria-labelledby="logTitle">
        <div class="panel-header panel-header-split">
          <div>
            <h2 id="logTitle">日志</h2>
            <p id="processMeta" class="process-meta">等待启动</p>
          </div>
          <div class="log-action-row">
            <button id="exportLogsButton" class="ghost-button" type="button">导出</button>
            <button id="clearLogsButton" class="ghost-button" type="button">清空</button>
          </div>
        </div>
        <pre id="logs" class="logs" aria-live="polite"></pre>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
