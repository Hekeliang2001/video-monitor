name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build EXE and Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build single EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name VideoMonitorConsole `
            --add-data "web;web" `
            --collect-all playwright `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import uvicorn.loops.asyncio `
            --hidden-import uvicorn.protocols.http.h11_impl `
            launcher.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer-output | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "VideoMonitorConsole.iss"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoMonitorConsole-Windows
          if-no-files-found: error
          path: |
            dist\VideoMonitorConsole.exe
            installer-output\VideoMonitorConsoleSetup.exe
            README_WINDOWS.md
